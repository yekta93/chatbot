name: danayar-front-{$USER}

include:
  - ../../compose.common.yml


services:
  front:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
      - ~/.ssh:/home/node/.ssh

  back:
    build: 
      context: ../../backend
      dockerfile: Dockerfile

    depends_on:
      - mongodb
      - minio
      - postgresql
      - initialization
      

    environment:
      - CHAINLIT_AUTH_SECRET="abcdefghijklmnop"
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOG_LEVEL=10
      - LLAMA_CLOUD_API_KEY=${LLAMA_CLOUD_API_KEY}
