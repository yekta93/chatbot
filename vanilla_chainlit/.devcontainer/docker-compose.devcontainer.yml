name: danayar-vanilla-chainlit-{$USER}

services:
  postgresql:
    image: docker.arvancloud.ir/bitnami/postgresql:17
    # volumes:
    #   - 'postgresql_data:/bitnami/postgresql'
    environment:
      - 'ALLOW_EMPTY_PASSWORD=yes'
      - 'POSTGRESQL_USERNAME=postgres'
      - 'POSTGRESQL_POSTGRES_PASSWORD=postgres123'
    restart: always
    healthcheck:
        test: ["CMD", "pg_isready", "-U", "postgres"]
        interval: 10s
        timeout: 5s
        retries: 3
        start_period: 30s
  chainlit:
    build: 
      context: ../
      dockerfile: .devcontainer/Dockerfile
      
    command: sleep infinity

    environment:
      - CHAINLIT_AUTH_SECRET="abcdefghijklmnop"
      - CHAINLIT_CUSTOM_AUTH=false
      - OPENAI_API_KEY=${OPENAI_API_KEY}

    volumes:
      - ../..:/workspaces:cached
      - ~/.ssh:/home/vscode/.ssh
      - dev_cache:/home/vscode/.cache/

volumes:
  dev_cache:
    driver: local
  